services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_backend
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ================= API SERVICE =================
  app-api:
    build: .
    container_name: user-crud-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_MODE: api
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped

  # ================= CONSUMER SERVICE =================
  app-consumer:
    build: .
    container_name: user-crud-consumer
    env_file:
      - .env
    environment:
      APP_MODE: consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
